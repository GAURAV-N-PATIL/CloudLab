spring.application.name=cloudlab-backend

# Active profile defaults to "dev". Override with SPRING_PROFILES_ACTIVE=prod when deploying.
spring.profiles.default=dev

spring.datasource.url=jdbc:mysql://localhost:3306/cloudlab
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Verbose logging lives in application-dev.properties.
logging.level.org.springframework.security=WARN
