spring.application.name=cloudlab-backend

# Active profile defaults to "dev". Override with SPRING_PROFILES_ACTIVE=prod when deploying.
spring.profiles.default=dev

# Render/Railway/Fly etc. tell the app which port to listen on via PORT.
server.port=${PORT:8080}

# Database. Defaults match local development; override all three in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloudlab}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Browser origins allowed to call the API (comma-separated, no trailing slash).
# Production example: https://cloudlab-gold.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Verbose logging lives in application-dev.properties.
logging.level.org.springframework.security=WARN
