# Tests run against in-memory H2 in MySQL mode, so `./mvnw test` needs no database server.
# The real schema is loaded and Hibernate validates the entities against it.
spring.datasource.url=jdbc:h2:mem:cloudlab;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema_hosted.sql
spring.sql.init.data-locations=classpath:test-data.sql
spring.jpa.hibernate.ddl-auto=validate

jwt.secret=test-only-secret-key-not-used-in-production-32-bytes-min
jwt.expiration=86400000
